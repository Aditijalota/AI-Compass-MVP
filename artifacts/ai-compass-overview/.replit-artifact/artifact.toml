kind = "video"
videoAspectRatio = "16:9"
previewPath = "/ai-compass-overview/"
title = "AI Compass — Animated Overview"
description = "A 30-second landscape animated overview of AI Compass’s three discovery pathways, LLM-powered follow-ups, solution-fit recommendations, human review safeguards, and opportunity dashboard."
version = "1.0.0"
id = "artifacts/ai-compass-overview"
router = "path"

[[services]]
name = "web"
paths = [ "/ai-compass-overview/" ]
localPort = 21029

[services.development]
run = "pnpm --filter @workspace/ai-compass-overview run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-compass-overview", "run", "build" ]
serve = "static"
publicDir = "artifacts/ai-compass-overview/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21029"
BASE_PATH = "/ai-compass-overview/"
